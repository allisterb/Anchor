name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both legs. A Windows-only failure is usually a path or line-ending problem and a
      # Linux-only one usually a solver or JVM problem, so cancelling the other leg hides the
      # comparison that identifies which.
      fail-fast: false
      matrix:
        os:
          - windows-latest
          # Pinned to 22.04 to match the solver-builds asset the scripts fetch. The runner version
          # does not change which asset is downloaded, but it does decide what the binary runs on.
          - ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TLC runs out-of-process on a real JVM because it cannot run under IKVM, so the tests need a
      # JDK. The build scripts check for one and fail if it is absent; they never install it.
      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # lib/ is gitignored, so every run would otherwise re-download ~30 MB. Keyed on the scripts
      # because that is where the versions and hashes live: change a pin and the cache is bypassed.
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: lib
          key: anchor-lib-${{ runner.os }}-${{ hashFiles('build.ps1', 'build.sh') }}

      # Without this the nine Python harnesses in HarnessTests.cs SKIP, and the run reports green
      # having exercised none of them — the graph translator, every differential test against a
      # real engine, and the vacuity checker. That is the weakest possible signal: a build that
      # passes because it did not look.
      #
      # 3.13 exactly. `check_python.py` asks the venv's own interpreter whether it clears the floor
      # recorded in the lock's header, so an older runner default fails here with that message
      # rather than much later inside pip.
      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Keyed on the lock AND the exact interpreter. A venv records the absolute path of the base
      # interpreter it was built from, so a patch bump under setup-python would leave a restored
      # venv pointing at one that is no longer there. Both in the key means that invalidates
      # instead of producing a broken environment that fails somewhere unrelated.
      - name: Cache the Python virtual environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: python
          key: anchor-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements/strands/requirements.txt') }}

      # The same scripts a person runs, not a reimplementation of them. They enforce
      # --require-hashes (every package, transitive included, matches its recorded digest) and
      # --only-binary=:all: (no sdists, so no setup.py executes during install), and they copy
      # pip.ini into the venv where pip actually reads it. A hand-rolled `pip install` step here
      # would be a second code path that could silently drop one of those.
      - name: Install the Python dependencies (Windows)
        if: runner.os == 'Windows' && steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv python
          ./requirements/strands/install.cmd

      - name: Install the Python dependencies (Linux)
        if: runner.os == 'Linux' && steps.venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv python
          ./requirements/strands/install.sh

      # CI is set by GitHub, and the scripts turn it into RestoreLockedMode=true, so a restore that
      # would silently re-resolve a committed packages.lock.json fails instead.
      #
      # Expect this to be slow on a cold cache: IKVM cross-compiles tla2tools.jar into an assembly,
      # which dominates a first build.
      # Each OS runs its own script, so both get real execution coverage rather than a lint.
      #
      # Two steps rather than one parameterised by the matrix. A step's `shell:` does not accept the
      # `matrix` context — GitHub validates which contexts each key may use, separately from YAML
      # syntax — and `shell: ${{ matrix.shell }}` fails the whole workflow at startup with
      # "Unrecognized named-value: 'matrix'", before any job is created. `run:` does accept it, so
      # the error names only the one line.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Test

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./build.sh -c Release -t
