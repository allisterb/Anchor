\* THE SHIPPED BEHAVIOUR. A synchronous `before_tool_call` cannot be interleaved,
\* so the read-modify-write is atomic and the cap holds. This is the control: it
\* is what makes the other two configs mean something.
SPECIFICATION Spec

\* Every task ends in "done", which has no successor action.
CHECK_DEADLOCK FALSE

CONSTANTS
    Tools = {t1, t2, t3}
    Limit = 1
    Grain = "atomic"

INVARIANT TypeOK
INVARIANT CapRespected
INVARIANT CounterHonest
