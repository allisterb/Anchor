\* EXPECTED TO FAIL, and this is the finding. The hook awaits between reading the
\* call counter and writing it back -- which is what a shared or persisted counter
\* store forces, and the handler's own docstring points at persisting it.
\*
\* Two tool tasks in the same batch read the same value, both write one more than
\* it, and both decide on a count that is short by one. The cap admits more calls
\* than it allows, and nothing in the policy is wrong.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Tools = {t1, t2, t3}
    Limit = 1
    Grain = "readWrite"

INVARIANT TypeOK
INVARIANT CapRespected
INVARIANT CounterHonest
