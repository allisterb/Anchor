\* HOLDS, and that is the point of running it. The hook is async and DOES suspend
\* -- between writing the counter and deciding on it, which is where an await
\* lands if the policy engine is remote or the context enricher is async.
\*
\* The counter still serializes, so each task decides on a distinct value and the
\* cap holds. "Async hooks are unsafe" is too crude to act on; the unsafe thing is
\* specifically a suspension between the READ and the WRITE.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Tools = {t1, t2, t3}
    Limit = 1
    Grain = "writeDecide"

INVARIANT TypeOK
INVARIANT CapRespected
INVARIANT CounterHonest
