SPECIFICATION Spec

\* A run ends after MaxSteps, which has no successor action.
CHECK_DEADLOCK FALSE

CONSTANTS
    MaxAmount = 2
    MaxSteps = 6
    Gate = "aggregate"
    MayRotate = TRUE

INVARIANT TypeOK

\* EXPECTED TO FAIL. The forbid caps a session's running total; the caller supplies
\* the session id, so rotating it hands them a fresh allowance. The counterexample is
\* the sequence of trades and rotations that walks past the cap.
INVARIANT GlobalCapHolds
