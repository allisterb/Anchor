SPECIFICATION Spec

CHECK_DEADLOCK FALSE

\* The same policy set with approvals forbidden. The sell permit is untouched and
\* still validates -- and can no longer fire, because a denied ApproveSale is
\* recorded as an `error` event and this permit's condition matches `response`.
CONSTANTS
    MaxAttempts = 3
    Target = "p_sell_response"
    ForbidApprovals = TRUE

INVARIANT TypeOK

\* EXPECTED TO PASS, and that is the finding: no session makes the permit grant
\* anything. Vacuity is the absence of a witness, so the quiet result is the bad one.
INVARIANT NeverFires
