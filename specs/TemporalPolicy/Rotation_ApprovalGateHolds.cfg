SPECIFICATION Spec

\* A run ends after MaxSteps, which has no successor action.
CHECK_DEADLOCK FALSE

CONSTANTS
    Limit = 3
    MaxAmount = 2
    MaxSteps = 6
    Gate = "approval"
    MayRotate = TRUE

INVARIANT TypeOK

\* HOLDS, and that is the finding. Rotation empties the trajectory, so a permit gated
\* on a prior approval stops firing: it FAILS CLOSED. The same move that defeats an
\* aggregate cap costs the caller the capability here.
INVARIANT EveryTradeApproved
