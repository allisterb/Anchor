SPECIFICATION Spec

\* A session ends when MaxAttempts have been made, which has no successor action.
CHECK_DEADLOCK FALSE

\* Approvals are permitted, and the sell permit is gated on a COMPLETED approval.
CONSTANTS
    MaxAttempts = 3
    Target = "p_sell_response"
    ForbidApprovals = FALSE

INVARIANT TypeOK

\* MEANT TO FAIL. A violation is the witness session showing the permit can grant
\* something; no error would mean it is vacuous. See the header of TemporalPolicy.tla.
INVARIANT NeverFires
