SPECIFICATION Spec

CHECK_DEADLOCK FALSE

\* Approvals forbidden again -- but the permit under test is gated on
\* ApproveSale::request rather than ::response. One word different from the
\* config above, and the opposite outcome.
\*
\* A `request` event is recorded for every attempt, permitted or not. So this gate
\* opens on "somebody TRIED to get an approval", and every one of those attempts
\* was denied. The permit is satisfiable, which here is the bad news: it grants
\* the capability the approval was supposed to protect.
CONSTANTS
    MaxAttempts = 3
    Target = "p_sell_request"
    ForbidApprovals = TRUE

INVARIANT TypeOK

\* MEANT TO FAIL: the violation is the witness session in which a sell is
\* authorized off a denied approval attempt.
INVARIANT NeverFires
